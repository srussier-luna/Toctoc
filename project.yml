name: Clippy
options:
  bundleIdPrefix: com.srussier
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  SwiftLintPlugins:
    url: https://github.com/SimplyDanny/SwiftLintPlugins
    from: 0.65.1
targets:
  Clippy:
    type: application
    platform: macOS
    sources:
      - path: Clippy
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    info:
      path: Clippy/Info.plist
      properties:
        CFBundleDisplayName: Toctoc
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.srussier.Clippy
            CFBundleURLSchemes:
              - clippy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srussier.Clippy
        PRODUCT_NAME: Toctoc
        PRODUCT_MODULE_NAME: Clippy
    scheme:
      testTargets:
        - ClippyTests
  ClippyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClippyTests
    buildToolPlugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLintPlugins
    dependencies:
      - target: Clippy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.srussier.ClippyTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Toctoc.app/Contents/MacOS/Toctoc
        BUNDLE_LOADER: $(TEST_HOST)
